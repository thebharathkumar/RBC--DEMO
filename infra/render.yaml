services:
  - type: web
    name: rbc-research-api
    runtime: docker
    plan: standard
    region: oregon
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_LOG_LEVEL
        value: INFO
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: NEWSAPI_API_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: rbc-research-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: rbc-research-redis
          property: connectionString

  - type: web
    name: rbc-research-web
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    autoDeploy: true

  - type: redis
    name: rbc-research-redis
    plan: starter
    region: oregon
    ipAllowList: []

databases:
  - name: rbc-research-db
    plan: standard
    region: oregon
    postgresMajorVersion: 16
